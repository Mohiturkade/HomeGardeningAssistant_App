<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Home Gardening Assistant</title>
  <link rel="stylesheet" href="/frontend/css/login.css" />
</head>
<body>
  <div class="logo-box">

    <img src="home gardening assistant app-logo.jpg" alt="logo">
    <h1>GardenLy</h1>
  </div>


  
  <div class="signup-container">
    <div class="text-section">
      <h1>Welcome Back</h1>
      <p>Sign in to tend your garden.</p>
    </div>
    <input id="signup-email" type="email" placeholder="Email" required />
    <input id="signup-password" type="password" placeholder="Password" required />
    <button id="signup-btn">Login</button>
    <a href="login.html">New here? Create an account</a>
    
    <p id="signup-message"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
